<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hello, Sam</title>
</head>
<body>
  <h1>Hello, Sam!</h1>
  <p>Today is <span id="date"></span>.</p>

  <script>
    document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
  </script>
</body>
</html>
